server:
  port: 8500
  servlet:
    context-path: /api
spring:
  application:
    name: ocr-ddd
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
        druid:
          driver-class-name: ${spring.datasource.druid.driver-class-name}
          url: jdbc:mysql://${db.host}:${db.port}/${db.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
          username: ${spring.datasource.username}
          password: ${spring.datasource.password}

  redis:
    host: ${spring.redis.host}
    database: ${spring.redis.database}
    password: ${spring.redis.password}
    port: ${spring.redis.port}
    timeout: 5000

  cloud:
    nacos:
      discovery:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
#        password: ${spring.cloud.nacos.discovery.password}
#        username: ${spring.cloud.nacos.discovery.username}
    sentinel:
      enabled: true # 是否开启。默认为 true 开启
      eager: true # 是否饥饿加载。默认为 false 关闭
      transport:
        dashboard: ${spring.cloud.sentinel.transport.dashboard}
        port: ${spring.cloud.sentinel.transport.port}
        clientIp: ${spring.cloud.sentinel.transport.clientIp}
      filter:
        url-patterns: /**
      log:
        dir: ./logs

management:
  endpoint:
    sentinel:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'

feign:
  sentinel:
    enabled: true
  okhttp:
    enabled: true # 开启OKHttp功能

logging:
  level:
    root: INFO
  file:
    path: ./logs
    name: ocr-ddd.log
  pattern:
    console: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"

minio:
  endpoint: ${minio.endpoint}
  username: ${minio.username}
  password: ${minio.password}
  bucket: ${minio.bucket}
#ocr:
#  url: ${ocr.url}
wechat:
  config:
    app-id: ${wechat.config.app-id}
    original-id: ${wechat.config.original-id}
    token: ${wechat.config.token}
  pay:
    api-v3-key: ${wechat.pay.api-v3-key} # 证书解密的秘钥
    private-key-file-path: ${wechat.pay.private-key-file-path} # 商户私钥文件
    mch-id: ${wechat.pay.mch-id}
    mch-serial-no: ${wechat.pay.mch-serial-no}  # 商户api证书的证书序列号
    notify-url: ${wechat.pay.notify-url}  # 支付成功的回调地址
    appid: ${wechat.pay.appid} #商家appid

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lrc.ocr.po
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
